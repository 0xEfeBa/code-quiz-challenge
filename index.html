<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code Quiz Challenge</title>
  
  <!-- Favicon -->
  <link rel="icon" href="image/favicon.ico" type="image/x-icon">
  
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      padding: 0;
    }
    
    .loader-container {
      text-align: center;
    }
    
    .loader {
      border: 6px solid #f3f3f3;
      border-top: 6px solid #4CAF50;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1.5s linear infinite;
      margin: 20px auto;
    }
    
    .message {
      font-size: 18px;
      color: #333;
      margin-top: 20px;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loader-container">
    <div class="loader"></div>
    <div class="message">Loading Code Quiz Challenge...</div>
  </div>
  
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Check if user is logged in
      const currentUser = localStorage.getItem("currentUser");
      
      // Set a short timeout to allow the loading animation to be seen
      setTimeout(function() {
        if (currentUser) {
          // User is logged in, redirect to about.html
          window.location.href = "pages/about.html";
        } else {
          // User is not logged in, redirect to login.html
          window.location.href = "pages/login.html";
        }
      }, 1500); // 1.5 seconds delay for better UX
    });
  </script>
</body>
</html>
